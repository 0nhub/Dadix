[package]
name = "dadix-desktop"
version = "0.1.0"
description = "Dadix desktop shell (Tauri 2)"
authors = ["you"]
edition = "2021"

[lib]
name = "dadix_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dadix-core = { path = "../../crates/dadix-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
